name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-harness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка dev-зависимостей
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff (линт)
        run: ruff check src tests

      - name: Ruff (формат)
        run: ruff format --check src tests

      - name: pytest
        run: pytest

      - name: mypy
        run: mypy
        continue-on-error: true
