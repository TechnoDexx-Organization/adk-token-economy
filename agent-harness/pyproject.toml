[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.2.0"
description = "Универсальная обвязка для LLM-агентов (экономия токенов, память, эмоции, безопасность, динамические навыки)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Igor Golov" }]
keywords = ["llm", "agent", "adk", "context-window", "rag", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "python-dotenv",
]

[project.optional-dependencies]
adk = [
    "google-adk>=2.13.0",
    "litellm>=1.84",
    "transformers>=4.40",
    "torch"
]
nlp = [
    "transformers>=4.40",
    "torch"
]
# Структурированный экспорт логов/трейсинг в Monium (OTLP). Без этого extra
# ядро пишет JSON-логи в stdout и опentelemetry не импортируется.
observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-logging>=0.48b0",
]
dev = [
    "pytest>=8.0",
    "tiktoken>=0.7",
    "ruff>=0.3.0",
    "mypy>=1.8",
    "matplotlib>=3.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Тесты работают на чистом клоне, без `pip install -e .`
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["harness"]
# Постепенная типизация: строгость включаем по мере появления аннотаций.
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

# --- CPU-сборка torch (без CUDA) -------------------------------------------
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
