[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.2.0"
description = "Универсальная обвязка для LLM-агентов (экономия токенов, память, эмоции, безопасность, динамические навыки)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
]

[project.optional-dependencies]
adk = [
    "google-adk>=2.13.0",
    "litellm>=1.84",
    "transformers>=4.40",
    "torch"
]
nlp = [
    "transformers>=4.40",
    "torch"
]
dev = [
    "pytest>=8.0",
    "tiktoken>=0.7",
    "ruff>=0.3.0",
    "matplotlib>=3.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

# --- CPU-сборка torch (без CUDA) -------------------------------------------
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
