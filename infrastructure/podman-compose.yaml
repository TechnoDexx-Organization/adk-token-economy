services:
  # 1. Сервер эмбеддингов BGE-M3
  bge-m3:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: bge-m3-server
    ports:
    - "127.0.0.1:9932:8080"
    volumes:
    - ${BGE_M3_MODEL_DIR}:/models:ro
    command: >
      -m /models/${BGE_M3_MODEL_FILE} --embeddings --host 0.0.0.0 --port 8080
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Реранкер BGE-reranker-v2-m3 (второй этап RAG)
  bge-reranker:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: bge-reranker
    ports:
    - "127.0.0.1:9933:8080"
    volumes:
    - ${BGE_RERANKER_MODEL_DIR}:/models:ro
    command: >
      -m /models/${BGE_RERANKER_MODEL_FILE} --reranking --host 0.0.0.0 --port 8080
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. Векторная база данных Qdrant
  qdrant:
    image: docker.io/qdrant/qdrant:v1.20.0
    container_name: qdrant
    ports:
    - "127.0.0.1:6333:6333" # HTTP API
    - "127.0.0.1:6334:6334" # gRPC
    environment:
    - QDRANT__STORAGE__QUOTAS__ENABLED=true
    - QDRANT__STORAGE__QUOTAS__MAX_DISK_USAGE_PERCENT=95
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped
volumes:
  qdrant_data:
    driver: local