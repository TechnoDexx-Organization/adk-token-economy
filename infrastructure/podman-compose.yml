services:
  # 1. Сервер эмбеддингов BGE-M3
  bge-m3:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: bge-m3-server
    ports:
      - "127.0.0.1:9932:8080"
    volumes:
      - ${BGE_M3_MODEL_DIR:-~/.lmstudio/models/gpustack/bge-m3-GGUF}:/models:ro
    command: >
      -m /models/${BGE_M3_MODEL_FILE:-bge-m3-Q4_K_M.gguf}
      --embeddings
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Реранкер BGE-reranker-v2-m3 (второй этап RAG)
  bge-reranker:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: bge-reranker
    ports:
      - "127.0.0.1:9933:8080"
    volumes:
      - ${BGE_RERANKER_MODEL_DIR:-~/.lmstudio/models/gpustack/bge-reranker-v2-m3-GGUF}:/models:ro
    command: >
      -m /models/${BGE_RERANKER_MODEL_FILE:-bge-reranker-v2-m3-Q8_0.gguf}
      --reranking
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 3. Векторная база данных Qdrant
  qdrant:
    image: docker.io/qdrant/qdrant:v1.12.4
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"  # HTTP API
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
